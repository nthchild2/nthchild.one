<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 756 206" width="756" height="206" role="img" aria-label="Events per hour with the machine at its pressure limit and below it" style="max-width:100%;height:auto;font:11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#52514e"><rect x="-18" y="-18" width="756" height="206" fill="#fcfcfb"/><rect x="0" y="4" width="10" height="10" rx="2" fill="#2a78d6"/><text x="15.0" y="13.0" text-anchor="start" fill="#52514e" font-size="11" font-weight="400">With the machine at its limit of 10</text><rect x="239.5" y="4" width="10" height="10" rx="2" fill="#898781"/><text x="254.5" y="13.0" text-anchor="start" fill="#52514e" font-size="11" font-weight="400">Below the limit</text><text x="140.0" y="53.0" text-anchor="end" fill="#52514e" font-size="12" font-weight="400">Obstructive apneas</text><rect x="150" y="36" width="311.3" height="13" rx="3" fill="#2a78d6"/><text x="467.3" y="46.5" text-anchor="start" fill="#0b0b0b" font-size="11" font-weight="600">13.1 an hour · at the limit</text><rect x="150" y="52" width="10.4" height="13" rx="3" fill="#898781"/><text x="166.4" y="62.5" text-anchor="start" fill="#0b0b0b" font-size="11" font-weight="400">0.44 an hour · below it</text><text x="140.0" y="99.0" text-anchor="end" fill="#52514e" font-size="12" font-weight="400">Hypopneas</text><rect x="150" y="82" width="370.0" height="13" rx="3" fill="#2a78d6"/><text x="526.0" y="92.5" text-anchor="start" fill="#0b0b0b" font-size="11" font-weight="600">15.6 an hour · at the limit</text><rect x="150" y="98" width="9.5" height="13" rx="3" fill="#898781"/><text x="165.5" y="108.5" text-anchor="start" fill="#0b0b0b" font-size="11" font-weight="400">0.40 an hour · below it</text><text x="140.0" y="145.0" text-anchor="end" fill="#52514e" font-size="12" font-weight="400">Central apneas</text><rect x="150" y="128" width="98.5" height="13" rx="3" fill="#2a78d6"/><text x="254.5" y="138.5" text-anchor="start" fill="#0b0b0b" font-size="11" font-weight